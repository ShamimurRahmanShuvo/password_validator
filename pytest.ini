[pytest]
testpaths = tests

pythonpath = src

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    unit: Unit tests for individual components
    integration: Integration tests covering multiple components
    slow: Tests that take longer to execute

filterwarnings =
    error

log_cli = false
